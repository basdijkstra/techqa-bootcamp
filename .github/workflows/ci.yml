name: CI

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore PixelVault.slnx

      - name: Build
        run: dotnet build PixelVault.slnx --no-restore --configuration Release

      - name: Run unit tests (answers)
        run: dotnet test tests/PixelVault.UnitTests --filter "FullyQualifiedName~PixelVault.UnitTests.Answers." --no-build --configuration Release

      - name: Run integration tests (answers)
        run: dotnet test tests/PixelVault.IntegrationTests --filter "FullyQualifiedName~PixelVault.IntegrationTests.Answers." --no-build --configuration Release

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Start the application
        # Runs in the background, so the next steps can run while the app keeps running.
        run: nohup dotnet run --project src/PixelVault.AppHost --configuration Release > apphost.log 2>&1 &

      - name: Wait for the application to be ready
        run: |
          urls="http://localhost:5173"
          for port in 5101 5102 5103 5104 5105 5106; do
            urls="$urls http://localhost:$port/health"
          done

          for url in $urls; do
            echo "Waiting for $url"
            for attempt in $(seq 1 60); do
              if curl --silent --fail --output /dev/null "$url"; then
                echo "$url is ready"
                continue 2
              fi
              sleep 5
            done
            echo "$url did not respond within 5 minutes"
            exit 1
          done

      - name: Install dependencies
        working-directory: tests/PixelVault.E2ETests
        run: npm ci

      - name: Run end-to-end tests (answers)
        working-directory: tests/PixelVault.E2ETests
        run: npx playwright test tests/answers

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/PixelVault.E2ETests/playwright-report
