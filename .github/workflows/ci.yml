name: CI

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore PixelVault.slnx

      - name: Build
        run: dotnet build PixelVault.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test tests/PixelVault.UnitTests --no-build --configuration Release
